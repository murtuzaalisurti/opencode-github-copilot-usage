name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # npm trusted publishing (OIDC)
  contents: write # GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck

      - name: Stage publish to npm
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm stage publish --tag beta
          else
            npm stage publish
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags="--generate-notes --verify-tag"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags="$flags --prerelease"; fi
          gh release create "$GITHUB_REF_NAME" $flags
